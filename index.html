<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOIR SPACE | 3D 住宅導覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1217;color:#f4eee5;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}header{height:68px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #343a40}.logo{letter-spacing:.22em;font-size:20px;font-weight:700}.logo span,.eyebrow,h2{color:#c8a878}header small{color:#9ca4ac}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);height:calc(100dvh - 68px);min-height:500px}aside{background:#191f25;border-right:1px solid #343a40;padding:28px 22px;overflow:auto}.eyebrow{font-size:11px;letter-spacing:.17em}h1{font-size:25px;font-weight:500;line-height:1.4}p{color:#abb3bb;font-size:13px;line-height:1.8}h2{font-size:12px;letter-spacing:.12em;margin:26px 0 13px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{background:#252c33;color:#e7e5e0;border:1px solid #424a51;border-radius:7px;padding:11px 7px;cursor:pointer;font:inherit;font-size:13px}button:hover,button.active{color:#e9c391;border-color:#c8a878;background:#39332c}.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#bfc5ca;margin:12px 0;cursor:pointer}input{accent-color:#c8a878}#reset{width:100%;margin-top:12px}main{position:relative;min-width:0;background:radial-gradient(ellipse,#313943,#10151b 75%)}canvas{width:100%;height:100%;display:block;touch-action:none}.toplabel{position:absolute;top:22px;left:22px;pointer-events:none}.toplabel b{font-weight:500;font-size:15px}.toplabel div{color:#b2b8bd;font-size:11px;margin-top:7px;letter-spacing:.08em}.hint{position:absolute;bottom:18px;left:18px;background:#12171cce;border:1px solid #ffffff25;padding:11px 14px;border-radius:8px;color:#c3c9cf;font-size:12px;line-height:1.7;pointer-events:none}.status{position:absolute;bottom:18px;right:18px;background:#12171cce;padding:11px 14px;border-radius:8px;color:#e9c391;font-size:12px;pointer-events:none}@media(max-width:760px){header{height:60px}.logo{font-size:15px}header small{font-size:9px}.layout{display:flex;flex-direction:column-reverse;height:auto;min-height:0}main{height:55dvh;min-height:340px}aside{padding:20px;border:0;border-top:1px solid #343a40}h1{font-size:21px}h2{margin-top:18px}.hint{font-size:10px;padding:8px;left:10px;bottom:10px}.status{right:10px;bottom:10px;font-size:10px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><div class="logo">NOIR <span>SPACE</span></div><small>INTERACTIVE LIVING EXPERIENCE</small></header><div class="layout"><aside><div class="eyebrow">INTERACTIVE FLOOR PLAN</div><h1>讓空間，隨生活轉變。</h1><p>約 25 坪的概念住宅。拖曳模型、放大縮小，從不同角度探索完整格局。</p><h2>空間導覽</h2><div class="buttons"><button class="active" data-view="iso">立體全景</button><button data-view="top">俯視格局</button><button data-view="living">客廳</button><button data-view="kitchen">廚房</button><button data-view="bed">主臥室</button><button data-view="bath">衛浴</button></div><h2>顯示選項</h2><label class="switch"><input type="checkbox" id="walls" checked> 顯示牆面</label><label class="switch"><input type="checkbox" id="labels" checked> 顯示空間標籤</label><label class="switch"><input type="checkbox" id="rotate"> 自動旋轉</label><button id="reset">重設視角</button><h2>設計說明</h2><p>包含客餐廳、開放式廚房、多功能中島、主臥、次臥與衛浴。此模型為互動展示示意，並非精準建築施工圖。</p></aside><main><canvas id="scene"></canvas><div class="toplabel"><b>THE FLEXIBLE HOME</b><div>3D MODEL · EXPLORE EVERY ANGLE</div></div><div class="hint">電腦：拖曳旋轉 · 滾輪縮放 · 右鍵平移<br>手機：單指旋轉 · 雙指縮放／平移</div><div class="status" id="status">立體全景</div></main></div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#scene'),main=document.querySelector('main');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(42,1,.1,200);camera.position.set(15,16,18);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=6;controls.maxDistance=40;controls.maxPolarAngle=Math.PI/2-.04;controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xf5f0e5,0x44505a,2.1));const sun=new THREE.DirectionalLight(0xffe7c2,3);sun.position.set(-8,17,11);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;scene.add(sun);
const mats={floor:0xc2b29b,wall:0xe2d8c8,wood:0x7d5840,dark:0x373b3d,sofa:0xc7beb1,accent:0xb79564,bed:0xe3ddd3,tile:0x9ba4a4,green:0x607763};const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.82});const house=new THREE.Group();scene.add(house);const wallMeshes=[];const labels=[];
function box(x,y,z,w,h,d,color,group=house){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);return mesh}
function wall(x,z,w,d,h=2.5){const mesh=box(x,h/2,z,w,h,d,mats.wall);wallMeshes.push(mesh);return mesh}
function label(text,x,z){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.fillStyle='rgba(24,29,34,.9)';ctx.roundRect(5,5,502,118,20);ctx.fill();ctx.fillStyle='#e9d3b0';ctx.font='bold 42px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,256,65);const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));s.position.set(x,3,z);s.scale.set(2.3,.57,1);house.add(s);labels.push(s)}
// 12m × 8m conceptual layout
box(0,-.2,0,12,.4,8,mats.floor);box(0,-.43,0,12.5,.07,8.5,0x55565a);
wall(-6,0,.16,8);wall(6,0,.16,8);wall(0,-4,12,.16);wall(0,4,12,.16);
// Left living / kitchen; right bedrooms and bathroom. Open gaps represent doors.
wall(1,0,.13,8);wall(3.55,-.9,5,.13);wall(3.55,2.05,5,.13);wall(3.05,.6,.13,2.8);
// living furniture
box(-3.5,.32,1.3,2.6,.55,.85,mats.sofa);box(-4.55,.7,1.3,.48,.8,.9,mats.sofa);box(-2.45,.7,1.3,.48,.8,.9,mats.sofa);box(-3.5,.17,-.1,1.65,.32,.85,mats.wood);box(-3.5,.02,.15,3.8,.035,3.2,0xb1a394);box(-5.5,.5,-.7,.35,1.0,1.9,mats.dark);box(-5.48,1.25,-.7,.1,.5,1.6,0x14191d);
// dining
box(-.5,.76,1.9,1.6,.12,1.15,mats.wood);for(const x of [-1.2,.2])for(const z of [1.3,2.5])box(x,.42,z,.44,.8,.42,mats.dark);
// kitchen and island
box(-4.3,.45,-3.45,3.0,.9,.85,mats.dark);box(-4.3,.94,-3.45,3.1,.09,.92,0xd4c9b8);box(-2.7,.45,-3.45,.85,.9,.85,mats.wood);box(-2.0,.48,-2.0,2.2,.95,1.0,mats.wood);box(-2.0,.99,-2.0,2.35,.1,1.12,0xd4c9b8);for(const x of [-2.7,-1.3])box(x,.42,-.95,.38,.8,.38,mats.dark);
// master bedroom top-right
box(4.45,.26,-2.4,2.2,.5,2.25,mats.wood);box(4.45,.56,-2.4,2.08,.14,2.1,mats.bed);box(4.45,.68,-3.2,1.9,.14,.45,0xc1b6a7);box(5.65,.42,-3.5,.5,.85,.5,mats.dark);box(2.0,.95,-3.45,1.1,1.9,.72,mats.wood);
// secondary room bottom-right
box(4.6,.24,3.1,1.65,.48,1.3,mats.wood);box(4.6,.55,3.1,1.55,.15,1.2,mats.bed);box(5.65,.4,2.65,.45,.8,.55,mats.dark);box(3.65,.42,3.55,.9,.8,.4,mats.wood);
// bathroom center-right
box(2.1,.03,.5,1.75,.06,2.75,mats.tile);box(2.25,.36,.0,.95,.7,.6,0xe7e7e2);box(2.25,.74,.0,.45,.08,.35,0xeef0ed);box(2.15,.4,1.3,.7,.8,.6,0xf3f3ef);box(2.15,.83,1.3,.7,.08,.6,0xe7e7e2);
// decoration
for(const [x,z] of [[-5.4,3.2],[-.2,-3.3],[5.5,1.5]]){box(x,.23,z,.45,.45,.45,0x5a5147);const plant=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),mat(mats.green));plant.position.set(x,.8,z);house.add(plant)}
label('客廳',-3.5,.45);label('廚房',-3.4,-2.7);label('主臥',4.4,-2.5);label('次臥',4.5,3);label('衛浴',2.1,.8);
const ground=box(0,-.52,0,200,.04,200,0x222932,scene);ground.receiveShadow=true;
const views={iso:{p:[15,16,18],t:[0,0,0],name:'立體全景'},top:{p:[.01,23,.01],t:[0,0,0],name:'俯視格局'},living:{p:[-7,8,10],t:[-3,0,1],name:'客廳'},kitchen:{p:[-8,8,-8],t:[-3,0,-2],name:'廚房'},bed:{p:[10,9,-9],t:[4,0,-2],name:'主臥室'},bath:{p:[8,9,6],t:[2,0,.6],name:'衛浴'}};let goal=null;
function setView(key){const v=views[key];goal={p:new THREE.Vector3(...v.p),t:new THREE.Vector3(...v.t)};document.querySelector('#status').textContent=v.name;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key))}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.querySelector('#reset').onclick=()=>setView('iso');document.querySelector('#walls').onchange=e=>wallMeshes.forEach(m=>m.visible=e.target.checked);document.querySelector('#labels').onchange=e=>labels.forEach(m=>m.visible=e.target.checked);document.querySelector('#rotate').onchange=e=>controls.autoRotate=e.target.checked;controls.autoRotateSpeed=.7;controls.addEventListener('start',()=>goal=null);
function resize(){const w=main.clientWidth,h=main.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(main);resize();function animate(){requestAnimationFrame(animate);if(goal){camera.position.lerp(goal.p,.075);controls.target.lerp(goal.t,.075);if(camera.position.distanceTo(goal.p)<.025&&controls.target.distanceTo(goal.t)<.025)goal=null}controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
